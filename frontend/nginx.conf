server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Forwards to the backend container (reachable by its Docker Compose service name,
    # "backend", on the shared network) — this is what lets the frontend work correctly
    # regardless of what domain/IP it's actually accessed from, instead of a hardcoded
    # "localhost:8080" that only worked when the browser and backend were on the same machine.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
