name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend unit tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Unit tests only (TransferServiceTest, FeeTierServiceTest, BankApiSimulatorServiceTest) —
      # everything is mocked with Mockito, no live Postgres needed here.
      - name: Run backend tests
        run: mvn -B test

  frontend-tests:
    name: Frontend unit tests (Karma/Jasmine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Headless Chrome — GitHub's ubuntu-latest runners come with Chrome preinstalled.
      - name: Run frontend tests
        run: npm test
