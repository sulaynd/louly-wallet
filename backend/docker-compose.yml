services:
  postgres:
    image: postgres:16
    container_name: meridian-postgres
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    ports:
      - "5433:5432"
    volumes:
      - meridian_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  meridian_pgdata:
